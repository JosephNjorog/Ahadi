<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
<style>
.r{stroke-dasharray:0 100;animation:draw 3.2s cubic-bezier(.65,0,.35,1) infinite}
.d{transform-box:fill-box;transform-origin:center;opacity:0;animation:settle 3.2s cubic-bezier(.34,1.3,.64,1) infinite}
@keyframes draw{0%{stroke-dasharray:0 100}28%,88%{stroke-dasharray:84 16}100%{stroke-dasharray:0 100}}
@keyframes settle{0%,20%{transform:translateY(-9px) scale(.4);opacity:0}36%{transform:translateY(1px) scale(1.08);opacity:1}44%{transform:translateY(-.5px) scale(.98)}50%,84%{transform:none;opacity:1}96%,100%{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.d{animation:none;opacity:1}.r{stroke-dasharray:84 16}}
</style>
<circle class="r" cx="16" cy="16" r="11" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round" pathLength="100" transform="rotate(-9 16 16)" fill="none"/>
<circle class="d" cx="16" cy="16" r="4.25" fill="#0a0a0a"/>
</svg>
