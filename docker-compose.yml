# Local Redis (and an optional local Postgres if you don't want to use a Neon branch for dev).
#   docker compose up -d redis              # Neon for the DB
#   docker compose --profile localdb up -d  # local Postgres + Redis
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    profiles: [localdb]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ahadi
      POSTGRES_PASSWORD: ahadi
      POSTGRES_DB: ahadi
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahadi"]
      interval: 5s
      retries: 10

volumes:
  redis-data:
  pg-data:
